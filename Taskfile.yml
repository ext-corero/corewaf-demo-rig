version: "3"

# CoreWAF demo rig v0.2 — every rig VM is a Docker container running QEMU/KVM.
# Thin wrappers around docker compose; docs/demo-kit.md is the runbook.
# Needs: Docker (+compose v2), /dev/kvm, an AWS credential for the CoreWAF
# registry in the environment (AWS_PROFILE=... with ~/.aws, or AWS_ACCESS_KEY_ID/...).

vars:
  DC: docker compose
  CLI: docker compose --profile tools run --rm cli

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]

  up:
    desc: 'Bring up the rig (rig-init: base image + CA + secrets; then the six VMs, each starts its stack)'
    cmds: ['{{.DC}} up -d']

  stop:
    desc: Graceful shutdown of all VMs (disks kept; `task up` boots them again)
    cmds: ['{{.DC}} --profile kit stop']

  down:
    desc: Stop + remove the node containers (VM disks/CA/secrets kept)
    cmds: ['{{.DC}} --profile kit down']

  reset:
    desc: 'DESTROY everything (VM disks, CA, secrets, base image cache) — cold start next `task up`'
    cmds: ['{{.DC}} --profile kit --profile tools down -v']

  status:
    desc: Node containers and health
    cmds: ['{{.DC}} --profile kit ps']

  verify:
    desc: Health checklist, run inside the rig network (works on Windows too)
    cmds: ['{{.CLI}} rig verify']

  ps:
    desc: 'What runs where: containers inside every guest (kits when up)'
    cmds: ['{{.CLI}} rig ps {{.NODE}}']

  stat:
    desc: Per-guest uptime / load / memory / disk
    cmds: ['{{.CLI}} rig stat {{.NODE}}']

  logs:
    desc: 'Logs of a container inside a guest: task logs NODE=gw-1 C=rig2-tunnel-gateway [ARGS="--tail 200"]'
    cmds: ['{{.CLI}} rig logs {{.NODE}} {{.C}} {{.ARGS}}']

  logs:
    desc: 'VM serial console of a node (NODE=app-1|dns-1|dns-2|gw-1|gw-2|obs-1|kit-demo)'
    requires: { vars: [NODE] }
    cmds: ['{{.DC}} --profile kit logs -f --tail=100 {{.NODE}}']

  ssh:
    desc: 'Shell into a guest (NODE=app-1 ... [CMD="..."])'
    requires: { vars: [NODE] }
    vars: { CMD: '{{.CMD | default ""}}' }
    cmds: ['{{.DC}} --profile kit exec {{if .CMD}}-T{{end}} -e VM_SSH_TTY={{if .CMD}}{{else}}1{{end}} {{.NODE}} vm-ssh {{.CMD}}']

  console:
    desc: 'Serial console login on a guest (NODE=kit-demo; alpine/alpine; Ctrl-] detaches)'
    requires: { vars: [NODE] }
    cmds: ['{{.DC}} --profile kit exec {{.NODE}} console']

  stack:
    desc: '(Re)start the role stack inside a guest, e.g. after an images.env bump (NODE=gw-1)'
    requires: { vars: [NODE] }
    cmds: ['{{.DC}} exec {{.NODE}} vm-stack']

  seed:
    desc: Load the demo data (dataset + fleet queue + CRS; NO_CRS=1 to skip CRS)
    cmds: ['{{.DC}} --profile tools run --rm -T -e RIG_REDUNDANCY -e RIG_OBS -e NO_CRS cli rig seed']

  kit:up:
    desc: 'Boot + stage + mint + enrol a kit in one go (NAME=demo|a|b) — same as kit.sh'
    vars: { NAME: '{{.NAME | default "demo"}}' }
    cmds: ['bash kit.sh {{.NAME}}']

  # ── demo kit ──────────────────────────────────────────────────────────
  demo:prep:
    desc: Boot + stage the demo kit VM (not enrolled)
    cmds: ['bash kit-prep.sh demo']

  demo:token:
    desc: 'Mint a provisioning token (value only). LABEL=demo TENANT=<owner> (needed on a fresh rig)'
    vars: { LABEL: '{{.LABEL | default "demo"}}', TENANT: '{{.TENANT | default ""}}' }
    cmds: ['{{.CLI}} rig mint {{.LABEL}} {{.TENANT}}']

  demo:enrol:
    desc: 'Enrol the demo kit from the host (TOKEN=<eyJ...>)'
    requires: { vars: [TOKEN] }
    cmds: ['bash kit-enrol.sh demo {{.TOKEN}}']

  demo:reset:
    desc: Destroy + re-stage the demo kit VM (fresh TPM → fresh hwId) and print a token
    cmds:
      - '{{.DC}} --profile kit rm -sf kit-demo || true'
      - 'docker volume rm -f corewaf-demo-rig_rig-node-kit-demo >/dev/null 2>&1 || true'
      - task: demo:prep
      - 'echo TOKEN:'
      - task: demo:token

  demo:instances:
    desc: List registered WAF instances with heartbeat age
    cmds: ['{{.CLI}} rig verify | sed -n "/registered WAF instances/,/summary/p"']

  # ── base image (CI builds + publishes it; these are developer helpers) ──
  base:build:
    desc: 'Developer: build the VM base image locally with packer (needs kvm)'
    cmds: ['bash scripts/build-kit-base.sh --force']
  base:publish:
    desc: 'Publish .cache/corewaf-rig-base.qcow2 to the registry (TAG=<tag>; push identity)'
    requires: { vars: [TAG] }
    cmds: ['bash scripts/publish-base.sh {{.TAG}}']

  qemu:up:
    desc: 'Model 3 — pure-QEMU rig (no Docker on the host): boot the six VMs'
    cmds: ['qemu/rig-qemu up']
  qemu:verify: { cmds: ['qemu/rig-qemu verify'] }
  qemu:status: { cmds: ['qemu/rig-qemu status'] }
  qemu:stop:   { cmds: ['qemu/rig-qemu stop'] }
