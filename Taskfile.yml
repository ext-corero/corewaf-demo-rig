version: "3"

# CoreWAF demo rig — multi-VM libvirt rig (app + dns-1/2 + gw-1/2 + obs VMs,
# each running its own docker stack) plus external kit VMs enrolled over the
# TLS edge + WireGuard. Runbook: docs/demo-kit.md
#
# Images come from the CoreWAF registry (ECR); you need a CoreWAF registry
# credential (IAM user in group corewaf-ecr-pull). See README.md.

vars:
  KIT_DIR: '../waf/corewaf-starter-kit'
  V2_API: 'http://app-1.rig.internal:8080'

tasks:

  default:
    desc: List available tasks
    cmds:
      - task --list

  # =====================================================================
  # v2 rig — infra VMs
  # =====================================================================
  up:
    desc: 'Bring up the rig (CA, network, VMs, stacks). Images pulled from images.env; RIG_MODE=source builds from ../ workspace'
    cmds:
      - bash up.sh

  bundle:
    desc: 'Offline bundle: pull every pinned image (needs registry access) and docker-save to .v2/bundle/'
    cmds:
      - bash bundle.sh save

  bundle:load:
    desc: 'Load .v2/bundle/rig-images.tar into the running infra VMs; then RIG_BUNDLE=1 task up'
    cmds:
      - bash bundle.sh load

  ca:init:
    desc: Create the rig root CA + runtime secrets if missing (.v2/, gitignored; up runs this)
    cmds:
      - bash ca-init.sh

  down:
    desc: 'Tear down the v2 rig VMs (DOWN=--net to also drop the network)'
    vars:
      DOWN: '{{.DOWN | default ""}}'
    cmds:
      - bash down.sh {{.DOWN}}

  stop:
    desc: Shut the v2 VMs down gracefully (disks kept; `task up` restarts them)
    cmds:
      - |
        for v in $(virsh -c qemu:///system list --name | grep '^rig2-'); do virsh -c qemu:///system shutdown "$v"; done

  status:
    desc: List the v2 infra VMs, their IPs and container health
    cmds:
      - bash verify.sh

  verify:
    desc: Smoke-check the v2 rig (VMs, containers, GUI/API/Grafana, DNS, WG peers)
    cmds:
      - bash verify.sh

  exec:
    desc: 'Run a command in a v2 VM (ROLE=app|dns|gw|obs [N=1|2] CMD="...")'
    requires:
      vars: [ROLE, CMD]
    vars:
      N: '{{.N | default ""}}'
    cmds:
      - bash vmlab.sh exec {{.ROLE}} {{.N}} '{{.CMD}}'

  logs:
    desc: 'Tail a v2 VM stack (ROLE=app|dns|gw|obs|secrets [N=1|2])'
    requires:
      vars: [ROLE]
    vars:
      N: '{{.N | default ""}}'
    cmds:
      - bash vmlab.sh exec {{.ROLE}} {{.N}} 'cd /opt/v2 && doas docker compose --env-file inventory.env -f compose/{{.ROLE}}.yml logs -f --tail=50'

  seed:
    desc: Load the demo dataset into the v2 rig (tenants, zones, secrets, policies)
    cmds:
      - bash vmlab.sh exec app 'doas docker exec rig2-waf-api python /app/demo/load.py --base http://localhost'

  # =====================================================================
  # v2 kits — external libvirt VMs enrolled against gw-1
  # =====================================================================
  kit:up:
    desc: 'Boot + enrol a kit VM in one shot (NAME=<id>, default kit-a)'
    vars:
      NAME: '{{.NAME | default "kit-a"}}'
    cmds:
      - bash kit-up.sh {{.NAME}}

  kit:list:
    desc: List kit VMs (rig-prefixed libvirt domains)
    cmds:
      - bash vm/vmlab.sh list

  kit:exec:
    desc: 'Run a command inside a kit VM (NAME=<id> CMD="...")'
    requires:
      vars: [NAME, CMD]
    cmds:
      - bash vm/vmlab.sh exec {{.NAME}} '{{.CMD}}'

  kit:console:
    desc: 'Serial console into a kit VM (NAME=<id>; login alpine/alpine; Ctrl-] detaches)'
    requires:
      vars: [NAME]
    cmds:
      - bash vm/vmlab.sh console {{.NAME}}

  kit:destroy:
    desc: 'Destroy a kit VM (NAME=<id>)'
    requires:
      vars: [NAME]
    cmds:
      - bash vm/vmlab.sh destroy {{.NAME}}

  # =====================================================================
  # Demo — a pre-staged kit VM enrolled live, from inside the VM.
  # Full runbook: docs/demo-kit.md
  # =====================================================================
  demo:prep:
    desc: 'Stage the demo kit VM, NOT enrolled (NAME=demo; KIT_REF=main; KIT_REPO_DIR=<local checkout> opt-in). Run before the demo.'
    vars:
      NAME: '{{.NAME | default "demo"}}'
    cmds:
      - bash kit-prep.sh {{.NAME}}

  demo:token:
    desc: 'Mint a provisioning token (value only) for the in-VM enrol (LABEL=demo; TENANT=<owner> if the rig has no demo tenants yet)'
    vars:
      LABEL: '{{.LABEL | default "demo"}}'
      TENANT: '{{.TENANT | default ""}}'
    cmds:
      - TENANT={{.TENANT}} RIG_API_BASE={{.V2_API}} PKG_API_ENDPOINT={{.V2_API}} bash scripts/tunnel-mint.sh {{.LABEL}} 2>/dev/null | sed -n 's/^provisioning_token=//p'

  demo:enrol:
    desc: 'Enrol the demo kit from the host instead of in-VM (NAME=demo TOKEN=<eyJ...>)'
    requires:
      vars: [TOKEN]
    vars:
      NAME: '{{.NAME | default "demo"}}'
    cmds:
      - bash kit-enrol.sh {{.NAME}} '{{.TOKEN}}'

  demo:reset:
    desc: 'Destroy + re-stage the demo kit VM and print a fresh token (NAME=demo)'
    vars:
      NAME: '{{.NAME | default "demo"}}'
    cmds:
      - bash vm/vmlab.sh destroy {{.NAME}} || true
      - task: demo:prep
        vars: { NAME: '{{.NAME}}' }
      - echo "TOKEN:"
      - task: demo:token

  demo:instances:
    desc: List registered WAF instances (name, phase, lastSeen) — spot stale rows to delete in the GUI
    cmds:
      - |
        curl -s -H 'X-Scope-OrgID: corero-system-owner' "{{.V2_API}}/caddys/api/v1/namespaces/corero-core/caddy/instances" \
        | python3 -c 'import sys,json
        for e in json.load(sys.stdin)["instances"]:
          i=e["instance"]; print(i["metadata"]["name"], i["status"].get("phase"), i["status"].get("lastSeen"))'

