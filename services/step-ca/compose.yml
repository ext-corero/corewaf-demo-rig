# demo rig — step-ca (app node). Ported from compose/app.yml (orchestrator path).
# Passwords come from service.json variables (rig: plain by design — see manifest).
x-logging: &x-default-logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

networks:
  app:
    name: app-rig
    external: true

volumes:
  stepca-data:

services:
  stepca-init:
    image: ${IMAGE_STEP_CLI}
    container_name: rig2-stepca-init
    logging: *x-default-logging
    user: "0:0"
    environment:
      STEPCA_PASSWORD: ${STEPCA_PASSWORD:?from service.json variables (orchestrator)}
    volumes:
      - stepca-data:/home/step
      - /opt/rig-ca:/rigca:ro
      - /opt/v2/config/stepca-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [ app ]

  stepca:
    image: ${IMAGE_STEP_CA}
    container_name: rig2-stepca
    hostname: stepca
    logging: *x-default-logging
    restart: unless-stopped
    depends_on:
      stepca-init: { condition: service_completed_successfully }
    environment:
      PWDPATH: /home/step/secrets/password
      CONFIGPATH: /home/step/config/ca.json
    ports:
      - "9000:9000"           # reachable cross-VM at app-1.rig.internal:9000
    volumes:
      - stepca-data:/home/step
    networks: [ app ]
    healthcheck:
      test: ["CMD", "curl", "-skf", "https://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s

  # Registers the tunnel-gateway-service JWK + ACME provisioners and writes
  # provisioner.jwk / root.crt / fingerprint to the SHARED host dir for gw/obs.
  stepca-bootstrap:
    image: ${IMAGE_STEP_CLI}
    container_name: rig2-stepca-bootstrap
    logging: *x-default-logging
    restart: on-failure
    user: "0:0"
    depends_on:
      stepca: { condition: service_healthy }
    environment:
      STEPCA_URL: https://stepca:9000
      STEPCA_ADMIN_PASSWORD: ${STEPCA_PASSWORD:?from service.json variables}
      STEPCA_PROVISIONER_PASSWORD: ${STEPCA_PROVISIONER_PASSWORD:?from service.json variables}
      STEPPATH: /tmp/step
      OUT_DIR: /secrets/tunnel-gw
    volumes:
      - /opt/shared-secrets:/secrets
      - /opt/v2/config/stepca-bootstrap.sh:/scripts/stepca-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/scripts/stepca-bootstrap.sh"]
    networks: [ app ]
