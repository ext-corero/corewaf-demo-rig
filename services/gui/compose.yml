# demo rig — waf-gui (app node). Ported from compose/app.yml (orchestrator path).
# depends_on waf-api dropped (cross-service); restart+healthcheck self-assemble.
x-logging: &x-default-logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

networks:
  app:
    name: app-rig
    external: true

services:
  waf-gui:
    image: ${IMAGE_GUI}
    container_name: rig2-waf-gui
    hostname: web-ui
    logging: *x-default-logging
    restart: unless-stopped
    environment:
      # Browser-side API address (from /etc/bootstrap; model-driven).
      PUBLIC_API_HOST: "${PUBLIC_API_HOST:-app-1.localhost:${RIG_HTTP_PORT:-28080}}"
      PUBLIC_DNS_BRIDGE_ACCESS: proxy
      PUBLIC_API_SCHEME: http
      API_INTERNAL_URL: "http://app-1.rig.internal:8080"
    networks: [ app ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      caddy: "http://gui-1.rig.internal, http://gui-1.localhost"
      caddy.reverse_proxy: "{{upstreams http 3000}}"
