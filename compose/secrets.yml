---
# demo rig — secrets-manager (vmsecd) stack. Runs on EACH dns VM
# (rig2-dns-1, rig2-dns-2) as a SEPARATE compose project (name: secrets-rig)
# so it coexists with the dns resolver stack on the same VM without orphan
# churn. Two instances => two SecretsManager records in the fleet, each
# self-registering via the app VM's provisioning API as system-secrets-manager
# (the seeded operator-service identity). Mirrors how the dns-bridge registers.
#
# vmsecd is KDBX-only here (the cold-boot data plane); the corewaf etcd
# secrets_api backend is left unconfigured. init-secrets mints SEEK/JWT once
# into a volume. Runs as root (user 0:0) like the rig dns-bridge, sidestepping
# named-volume ownership for the KDBX / state / generated-secrets writes.
#
# NODE_NAME/FQDN come per-instance from /etc/corewaf-bootstrap so
# this one file serves both dns-1 and dns-2.
#
# Run (via vm-stack (ROLE=dns, second invocation)):
#   docker compose --env-file inventory.env -f compose/secrets.yml up --build -d

name: secrets-rig

x-logging: &x-default-logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

networks:
  secrets:
    name: secrets-rig

volumes:
  vmsecd-secrets:   # SEEK_SECRET + JWT_SECRET, minted once by init-secrets
  vmsecd-data:      # the KDBX store + cold-boot registration-uuid state

services:
  init-secrets:
    image: ${RIG_REGISTRY}/${SECRETS_MANAGER_IMAGE}:${SECRETS_MANAGER_TAG}
    logging: *x-default-logging
    user: "0:0"
    networks: [ secrets ]
    volumes: [ "vmsecd-secrets:/secrets" ]
    command:
      - sh
      - -c
      - |
        if [ -f /secrets/vmsecd.env ] \
           && grep -q '^SEEK_SECRET=' /secrets/vmsecd.env \
           && grep -q '^JWT_SECRET=' /secrets/vmsecd.env; then
          echo "init: /secrets/vmsecd.env already exists — nothing to do"; exit 0
        fi
        echo "init: generating secrets"
        printf 'SEEK_SECRET=%s\nJWT_SECRET=%s\n' "$(pwgen -s 32 1)" "$(pwgen -s 32 1)" > /secrets/vmsecd.env
        chmod 600 /secrets/vmsecd.env
        echo "init: done"

  vmsecd:
    # No build: here — init-secrets builds the shared image:rig tag. Two
    # services building the same tag in one `up` race buildkit ("already
    # exists"); depends_on guarantees the image exists before vmsecd starts.
    image: ${RIG_REGISTRY}/${SECRETS_MANAGER_IMAGE}:${SECRETS_MANAGER_TAG}
    container_name: rig2-vmsecd
    logging: *x-default-logging
    restart: unless-stopped     # self-assembly: retry until app VM is reachable
    user: "0:0"
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    networks: [ secrets ]
    command:
      - sh
      - -c
      - |
        . /secrets/vmsecd.env && export SEEK_SECRET JWT_SECRET
        exec uvicorn secrets_manager:app --host 0.0.0.0 --port 8000
    environment:
      # --- legacy KDBX daemon (cold-boot data plane) ---
      KDBX_PATH: /data/secrets.kdbx
      ALLOWLIST_PATH: /config/allowlist.d
      TOKEN_TTL_MIN: "15"
      TRUSTED_PROXIES: "172.16.0.0/12"
      LOG_LEVEL: INFO
      LOG_JSON: "false"
      # --- provisioning-API self-registration (fleet visibility) ---
      # Reached through the app VM ingress (path-prefix routed), like the
      # dns-bridge. Re-registers automatically if the app etcd is wiped.
      PROVISIONING_API_URL: http://app-1.rig.internal:8080/provisioning
      NAMESPACE: corero-core
      ETCD_SCOPE_ORGID: system-secrets-manager
      SECMAN_ID: ${NODE_NAME}-secman
      SECMAN_REGION: rig-local
      SECMAN_VERSION: rig-dev
      SECMAN_ADVERTISED_URL: http://${FQDN}:8081
      SECMAN_HEARTBEAT_INTERVAL_S: "30"
      # Cold-boot-persistent registration uuid (under the appuser-writable
      # /data volume so a restart reconnects to its own SecretsManager record).
      SECMAN_STATE_PATH: /data/registration-state.json
    ports:
      - "8081:8000"
    volumes:
      - vmsecd-secrets:/secrets:ro
      - vmsecd-data:/data
      - /opt/v2/config/secrets:/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
