# compose/build/secrets.yml — RIG_MODE=source override: build the rig images from a
# sibling corewaf-workspace checkout instead of pulling the pins in images.env.
# Used by vmlab.sh as:  docker compose -f compose/secrets.yml -f compose/build/secrets.yml up --build
# RIG_SRC is the workspace root as seen inside the VM (virtiofs, source mode only).

services:
  init-secrets:
    build:
      context: ${RIG_SRC:-/opt/corewaf-workspace}/waf/secrets-manager
      dockerfile: Dockerfile
      # component-commons shared-code folder via a BuildKit named context
      # (Dockerfile does COPY --from=commons) — resolves the path dep, no creds.
      additional_contexts:
        commons: ${RIG_SRC:-/opt/corewaf-workspace}/waf/component-commons
    image: corewaf/secrets-manager:rig
  vmsecd:
    image: corewaf/secrets-manager:rig
