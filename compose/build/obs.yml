# compose/build/obs.yml — RIG_MODE=source override: build the rig images from a
# sibling corewaf-workspace checkout instead of pulling the pins in images.env.
# Used by vmlab.sh as:  docker compose -f compose/obs.yml -f compose/build/obs.yml up --build
# RIG_SRC is the workspace root as seen inside the VM (virtiofs, source mode only).

services:
  caddy-obs:
    build:
      context: ${RIG_SRC:-/opt/corewaf-workspace}/waf/system-loader/caddy-internal
      dockerfile: Dockerfile
    image: corewaf/caddy-internal:rig
