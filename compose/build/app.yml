# compose/build/app.yml — RIG_MODE=source override: build the rig images from a
# sibling corewaf-workspace checkout instead of pulling the pins in images.env.
# Used by vm-stack (RIG_MODE=source) as:  docker compose -f compose/app.yml -f compose/build/app.yml up --build
# RIG_SRC is the workspace root as seen inside the VM (virtiofs, source mode only).

services:
  waf-api:
    build:
      context: ${RIG_SRC:-/opt/corewaf-workspace}/waf/api
      dockerfile: Dockerfile
    image: corewaf/waf-api:rig
  waf-gui:
    build:
      context: ${RIG_SRC:-/opt/corewaf-workspace}/waf/gui
      dockerfile: Dockerfile
    image: corewaf/waf-gui:rig
  caddy:
    build:
      context: ${RIG_SRC:-/opt/corewaf-workspace}/waf/system-loader/caddy-internal
      dockerfile: Dockerfile
    image: corewaf/caddy-internal:rig
