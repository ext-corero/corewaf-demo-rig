# extension-image — build the Docker Desktop extension (UI + host helper) and publish it
#   ghcr.io/ext-corero/corewaf-demo-rig/extension:<semver> (+latest)   ← public, no login to install
#   <ECR>/io.corewaf.ghcr/rig/extension:<semver> (+latest)             ← twin
# Version = next-version-ghcr.sh (major.minor from extension/VERSION + build N).
name: extension-image
on:
  push:
    branches: [main]
    paths: ["extension/**", ".github/workflows/extension-image.yml"]
  workflow_dispatch:
    inputs:
      channel:
        description: "latest (dev) or stable"
        default: latest
      version:
        description: "release tag (vX.Y.Z) — used with channel=stable"
        default: ""
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
permissions:
  contents: read
  packages: write
jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Canonical scheme: VERSION holds major.minor; next-version-ghcr.sh
          # returns major.minor.N for :latest (dev). A stable release passes the
          # exact version; images use plain semver (the `v` prefix lives only on
          # git tags), so strip a leading v.
          channel="${{ github.event.inputs.channel || 'latest' }}"
          if [ "$channel" = "stable" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            ver="${{ github.event.inputs.version }}"; ver="${ver#v}"
          else
            ver="$(bash cicd/scripts/next-version-ghcr.sh ${{ github.repository }}/extension extension/VERSION)"
          fi
          echo "version=$ver"                  >> "$GITHUB_OUTPUT"
          echo "sha=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"
          echo "channel=$channel"              >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials (ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Ensure ECR repository
        run: aws ecr describe-repositories --repository-names io.corewaf.ghcr/rig/extension >/dev/null 2>&1 || aws ecr create-repository --repository-name io.corewaf.ghcr/rig/extension --image-scanning-configuration scanOnPush=true >/dev/null
      - uses: docker/build-push-action@v5
        with:
          context: ./extension
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            CHANNEL=${{ steps.ver.outputs.channel }}
          tags: |
            ghcr.io/${{ github.repository }}/extension:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}/extension:${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}
            ghcr.io/${{ github.repository }}/extension:${{ steps.ver.outputs.channel }}
            ${{ vars.ECR_REGISTRY }}/io.corewaf.ghcr/rig/extension:${{ steps.ver.outputs.version }}
            ${{ vars.ECR_REGISTRY }}/io.corewaf.ghcr/rig/extension:${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.sha }}
            ${{ vars.ECR_REGISTRY }}/io.corewaf.ghcr/rig/extension:${{ steps.ver.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          { echo "### Docker Desktop extension published"; echo '```'
            echo "docker extension install ghcr.io/${{ github.repository }}/extension:${{ steps.ver.outputs.version }}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
